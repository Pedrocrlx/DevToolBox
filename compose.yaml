services:
  backend:
    build: ./backend
    environment:
      ENABLE_DOCS: "true"
    command: [".venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/commands:/app/commands:ro
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    build: ./frontend/DevToolBox
    volumes:
      - ./frontend/DevToolBox/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
