# Include inside the http {} block of MidnightLibrary's Nginx configuration.
# The origin certificate must cover devtoolbox.pedrocrlx.pt.
server {
    listen 80;
    server_name devtoolbox.pedrocrlx.pt;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name devtoolbox.pedrocrlx.pt;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Resolve at request time so this application can restart independently.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $devtoolbox_upstream devtoolbox-web:80;

    client_max_body_size 4k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://$devtoolbox_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
