services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENABLE_DOCS: "false"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    build: ./frontend/DevToolBox
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
